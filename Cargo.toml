[workspace]
resolver = "2"
members = [
    "crates/a16_lexer",
    "crates/a16_parser",
    "crates/a16_ast",
    "crates/a16_hir",
    "crates/a16_typeck",
    "crates/a16_codegen",
    "crates/a16_vm",
    "crates/a16_cli",
    "crates/a16_vector",
    "crates/a16_tensor",
    "crates/a16_resolver",
    "crates/a16_pkg",
    "crates/a16_runtime",
    "crates/a16_ffi",
    "crates/a16_fmt",
    "crates/a16_lint",
    "crates/a16_doc",
    "crates/a16_lsp",
    "crates/a16_stdlib",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
repository = "https://github.com/a16-lang/a16"
homepage = "https://a16-lang.github.io"
description = "A16 - AI-native programming language with built-in tensors, embeddings, and vector memory"
keywords = ["programming-language", "ai", "machine-learning", "tensor", "compiler"]
categories = ["compilers", "development-tools", "science"]

[workspace.dependencies]
# Parsing
logos = "0.14"
rowan = "0.15"
smol_str = "0.2"

# Data structures
indexmap = "2.0"
dashmap = "5.5"
lasso = "0.7"

# Async
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# HTTP
reqwest = { version = "0.11", features = ["json", "stream"] }

# Error handling
thiserror = "1.0"
miette = { version = "7.0", features = ["fancy"] }
anyhow = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"

# Testing
insta = "1.34"
proptest = "1.4"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
lto = true
codegen-units = 1
